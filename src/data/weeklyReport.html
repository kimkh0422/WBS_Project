<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__WEEKLY_META_TITLE__</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    /* 호스트 WBS 앱(src/index.css)과 톤 통일: slate 중립 + indigo 액센트 */
    --navy:#0f172a; --navy2:#1e293b; --blue:#4f46e5; --sky:#6366f1; --teal:#0d9488;
    --bg:#eef2f8; --bg2:#f8fafc; --card:#ffffff; --line:#e2e8f0; --line2:#f1f5f9;
    --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8;
    --ok:#10b981; --okbg:#ecfdf5; --prog:#4f46e5; --progbg:#eef2ff;
    --wait:#f59e0b; --waitbg:#fffbeb; --bad:#ef4444; --badbg:#fef2f2;
    --idle:#64748b; --idlebg:#f1f5f9; --purple:#7c3aed; --purplebg:#f5f3ff;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 1px 3px rgba(15,23,42,.06),0 10px 30px -12px rgba(15,23,42,.12);
    --shadow-nav:0 1px 3px rgba(15,23,42,.05),0 10px 30px -12px rgba(15,23,42,.10);
    --radius:16px; --radius-sm:10px; --radius-pill:999px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
    background:var(--bg2);
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -20%, rgba(79,70,229,.07), transparent 55%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 38%, var(--bg) 100%);
  }
  a{color:inherit}
  .wrap{max-width:1500px; margin:0 auto; padding:0 24px 8px}

  /* 상단 메타 바 */
  .subtop{padding:22px 0 0}
  .subtop-inner{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px;
    background:var(--card);
    border:1px solid rgba(220,228,238,.95);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 20px 16px 20px;
    position:relative;
    overflow:hidden;
  }
  .subtop-inner::before{
    content:""; position:absolute; left:0; right:0; top:0; height:4px;
    background:linear-gradient(90deg,var(--navy) 0%,var(--blue) 42%,var(--teal) 100%);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .subtop-title{
    font-size:17px; font-weight:800; color:var(--navy);
    letter-spacing:-.35px; margin-right:6px; line-height:1.25;
  }
  .subtop .pill{
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(180deg,#f8fafd,var(--line2));
    border:1px solid var(--line); padding:7px 14px; border-radius:var(--radius-pill);
    font-size:12.5px; font-weight:600; color:var(--ink2);
    box-shadow:var(--shadow-sm);
  }
  .subtop .pill b{color:var(--navy); font-weight:700}

  /* ===== charts row ===== */
  .panels{display:grid;grid-template-columns:1.25fr 1fr 1.25fr;gap:16px;margin-top:16px}
  .panel{background:var(--card);border-radius:var(--radius);padding:16px 18px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:7px}
  .panel h3 .tag{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto}

  /* bar chart (org) */
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .barrow .nm{width:118px;font-size:11.5px;color:var(--ink2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barrow .track{flex:1;background:var(--line2);border-radius:6px;height:16px;overflow:hidden}
  .barrow .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));border-radius:6px;min-width:2px;transition:width .8s}
  .barrow .vv{font-size:11.5px;font-weight:700;color:var(--ink2);width:24px}

  /* donut */
  .donutwrap{display:flex;align-items:center;gap:16px}
  .donut{width:140px;height:140px;border-radius:50%;flex-shrink:0;position:relative}
  .donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
  .donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
  .donut .ctr b{font-size:24px;color:var(--navy);line-height:1}
  .donut .ctr span{font-size:10.5px;color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:6px;font-size:12px;flex:1}
  .legend .li{display:flex;align-items:center;gap:7px}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .legend .nm{color:var(--ink2)} .legend .vv{margin-left:auto;font-weight:700;color:var(--ink)}

  /* progress list */
  .prow{display:flex;align-items:center;gap:9px;margin:6px 0}
  .prow .nm{width:150px;font-size:11.3px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .prow .track{flex:1;background:var(--line2);border-radius:6px;height:14px;position:relative;overflow:hidden}
  .prow .plan{position:absolute;left:0;top:0;height:100%;background:repeating-linear-gradient(45deg,#cfe0f3,#cfe0f3 5px,#dfeaf7 5px,#dfeaf7 10px);border-radius:6px}
  .prow .act{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--teal),#23c0a0);border-radius:6px}
  .prow .vv{font-size:11px;font-weight:700;color:var(--ink2);width:40px;text-align:right}

  /* ===== layout: nav + content ===== */
  .layout{
    display:grid; grid-template-columns:minmax(220px,260px) minmax(0,1fr);
    gap:24px; margin:24px 0 64px; align-items:start;
  }
  main{min-width:0}
  nav.side{
    position:sticky; top:18px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow-nav);
    border:1px solid rgba(220,228,238,.9);
    padding:14px 12px 16px;
    max-height:calc(100vh - 36px);
    overflow:auto;
  }
  nav.side::before{
    content:"보고 조직"; display:block;
    font-size:11px; font-weight:800; color:var(--muted);
    letter-spacing:.04em; text-transform:uppercase;
    padding:4px 10px 10px; margin-bottom:2px;
    border-bottom:1px solid var(--line2);
  }
  nav.side .ngroup{
    font-size:10.5px; font-weight:800; color:var(--faint);
    text-transform:uppercase; letter-spacing:.55px;
    margin:14px 8px 6px; padding-top:10px;
    border-top:1px solid var(--line2);
  }
  nav.side .ngroup:first-child{border-top:none; margin-top:0; padding-top:0}
  nav.side a.nav{
    display:flex; align-items:center; gap:8px;
    padding:9px 11px; margin:2px 0;
    border-radius:var(--radius-sm);
    font-size:13px; color:var(--ink2);
    text-decoration:none; cursor:pointer;
    transition:background .15s var(--ease), color .15s, box-shadow .15s;
    border-left:3px solid transparent;
  }
  nav.side a.nav:hover{background:var(--line2); color:var(--ink)}
  nav.side a.nav.active{
    background:linear-gradient(90deg,var(--progbg),#fff);
    color:var(--navy); font-weight:700;
    border-left-color:var(--blue);
    box-shadow:var(--shadow-sm);
  }
  nav.side a.nav .cnt{
    margin-left:auto; font-size:10.5px; color:var(--muted);
    background:var(--line2); border-radius:var(--radius-pill);
    padding:2px 8px; font-weight:700; min-width:1.5em; text-align:center;
  }
  nav.side a.nav.active .cnt{background:var(--blue); color:#fff}

  /* search */
  .toolbar{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid rgba(220,228,238,.95);
    padding:12px 14px 12px 16px;
    display:flex; gap:12px; align-items:center;
    margin-bottom:20px; flex-wrap:wrap;
  }
  .toolbar input{
    flex:1; min-width:200px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:11px 14px; font-size:14px;
    font-family:inherit; color:var(--ink);
    background:var(--bg2);
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .toolbar input::placeholder{color:var(--faint)}
  .toolbar input:focus{
    border-color:var(--blue);
    background:var(--card);
    box-shadow:0 0 0 3px var(--progbg);
  }
  .toolbar .res{font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap}
  .toolbar .btn2{
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink2);
    padding:9px 14px;
    border-radius:var(--radius-sm);
    font-size:12.5px; font-weight:700;
    transition:border-color .15s, color .15s, background .15s, transform .12s;
    white-space:nowrap;
  }
  .toolbar .btn2:hover{
    border-color:var(--blue); color:var(--blue); background:var(--progbg);
  }
  .toolbar .btn2:active{transform:scale(.98)}

  /* report section */
  section.report{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    border:1px solid rgba(220,228,238,.85);
    margin-bottom:20px;
    overflow:hidden;
    scroll-margin-top:20px;
    transition:box-shadow .2s var(--ease), border-color .2s;
  }
  section.report:hover{box-shadow:var(--shadow); border-color:var(--line)}
  .rhead{
    display:flex; align-items:center; gap:14px;
    padding:17px 20px;
    cursor:pointer;
    background:linear-gradient(135deg,#f8fafc 0%,#fcfdfe 48%,#fff 100%);
    border-bottom:1px solid var(--line2);
  }
  .rhead:hover{background:linear-gradient(135deg,#f1f5f9 0%,#f8fafc 55%,#fff 100%)}
  .rhead .ic{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff;
    background:linear-gradient(145deg,var(--navy) 0%,var(--navy2) 40%,var(--blue) 100%);
    box-shadow:0 4px 12px rgba(26,111,212,.28);
  }
  .rhead .tt{flex:1; min-width:0}
  .rhead .tt h2{margin:0; font-size:17px; font-weight:800; color:var(--navy); letter-spacing:-.35px; line-height:1.25}
  .rhead .tt .meta{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45}
  .rhead .tt .meta b{color:var(--ink2); font-weight:600}
  .rhead .rstat{display:flex; gap:7px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; max-width:300px}
  .rhead .chev{
    flex-shrink:0; color:var(--muted);
    width:28px; height:28px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:var(--line2);
    transition:transform .22s var(--ease), background .15s;
    font-size:12px;
  }
  .rhead:hover .chev{background:var(--line); color:var(--ink2)}
  section.report.collapsed .chev{transform:rotate(-90deg)}
  section.report.collapsed .rbody{display:none}
  .rbody{padding:8px 20px 22px}

  .block{margin-top:18px}
  .block:first-of-type{margin-top:12px}
  .block > .bh{
    display:flex; align-items:center; gap:9px;
    margin:0 0 11px; font-size:13px; font-weight:800; color:var(--navy2);
  }
  .block > .bh .bar{width:4px; height:16px; border-radius:3px; background:var(--blue)}
  .block.iss > .bh .bar{background:var(--bad)} .block.strat > .bh .bar{background:var(--purple)}
  .block.sales > .bh .bar{background:var(--teal)} .block.next > .bh .bar{background:var(--wait)}
  .block .bh .c{font-size:11px; color:var(--muted); font-weight:600}

  /* tables */
  .tbl{
    width:100%; border-collapse:separate; border-spacing:0;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .tbl th{
    background:linear-gradient(180deg,#f1f5f9,#e7edf5);
    color:var(--ink2); font-weight:800; text-align:left;
    padding:10px 12px; font-size:11.5px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    letter-spacing:-.01em;
  }
  .tbl td{padding:11px 12px; border-bottom:1px solid var(--line2); vertical-align:top; color:var(--ink)}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{transition:background .12s}
  .tbl tbody tr:hover{background:#f5f9fd}
  .tbl .pname{font-weight:800;color:var(--navy);line-height:1.45}
  .tbl .pname .sm{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}
  .tbl ul{margin:0;padding-left:16px}
  .tbl ul li{margin:3px 0;color:var(--ink2);line-height:1.5}
  .tbl ul ul{padding-left:15px;margin:2px 0}
  .tbl ul ul li{color:var(--muted);font-size:11.5px}
  .nowrap{white-space:nowrap}
  .ctr-td{text-align:center;white-space:nowrap;color:var(--ink2)}
  .scroll{overflow-x:auto;border-radius:var(--radius-sm)}

  /* badges */
  .bdg{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;border-radius:var(--radius-pill);
    font-size:11px;font-weight:700;white-space:nowrap;line-height:1.45;
    border:1px solid transparent;
  }
  .bdg.t-do{background:var(--progbg);color:var(--prog);border-color:rgba(26,111,212,.12)}
  .bdg.t-mt{background:var(--okbg);color:var(--ok);border-color:rgba(15,154,106,.12)}
  .bdg.t-bid{background:var(--purplebg);color:var(--purple);border-color:rgba(107,79,201,.12)}
  .bdg.t-prop{background:#fdeef6;color:#b8326e;border-color:rgba(192,57,138,.1)}
  .bdg.t-plan{background:var(--waitbg);color:var(--wait);border-color:rgba(184,122,14,.15)}
  .bdg.t-prod{background:#eaf3ff;color:#2563c4;border-color:rgba(37,99,196,.12)}
  .bdg.t-rnd{background:#eafbf2;color:#0c8a5a;border-color:rgba(12,138,90,.12)}
  .bdg.t-etc{background:var(--idlebg);color:var(--idle);border-color:rgba(108,125,146,.12)}
  .st{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 10px;border-radius:var(--radius-sm);
    font-size:11px;font-weight:700;white-space:nowrap;
    border:1px solid transparent;
  }
  .st.open{background:var(--badbg);color:var(--bad);border-color:rgba(209,61,52,.12)}
  .st.new{background:var(--waitbg);color:var(--wait);border-color:rgba(184,122,14,.12)}
  .st.closed{background:var(--okbg);color:var(--ok);border-color:rgba(15,154,106,.12)}
  .st.prog{background:var(--progbg);color:var(--prog);border-color:rgba(26,111,212,.12)}
  .chip{
    display:inline-block;background:var(--line2);color:var(--ink2);
    border-radius:var(--radius-sm);padding:3px 9px;font-size:11px;font-weight:700;
    margin:2px 3px 2px 0;border:1px solid var(--line);
  }

  /* mini progress in cell */
  .pcell{min-width:100px}
  .pcell .pp{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .pcell .pp b{color:var(--teal)}
  .pcell .tk{background:var(--line2);height:8px;border-radius:var(--radius-pill);overflow:hidden;position:relative}
  .pcell .pl{position:absolute;left:0;top:0;height:100%;background:#dbe3ff;border-radius:var(--radius-pill)}
  .pcell .ac{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--teal),#1eb89a);border-radius:var(--radius-pill)}
  .pcell .txt{font-size:11.5px;font-weight:700;color:var(--ink2);text-align:center;white-space:nowrap}

  /* nested matrix table */
  .matrix{margin-top:10px}
  .matrix summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--blue);padding:6px 0;outline:none;border-radius:6px}
  .matrix summary:hover{color:var(--navy);text-decoration:underline}
  .mtbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px;border-radius:8px;overflow:hidden}
  .mtbl th,.mtbl td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
  .mtbl th{background:#eef2f7;color:var(--ink2);font-weight:800}
  .mtbl td.l{text-align:left}
  .mtbl .hb{background:#eef2ff;font-weight:800;color:var(--navy)}

  .empty{color:var(--faint);font-size:13px;font-style:italic;padding:12px 4px;text-align:center;background:var(--line2);border-radius:var(--radius-sm)}
  .hl{background:linear-gradient(180deg,transparent 60%,#fff0a8 60%);border-radius:2px;padding:0 2px}
  ::selection{background:rgba(26,111,212,.14);color:var(--ink)}

  .page-footer{
    max-width:720px;margin:0 auto;
    color:var(--muted);font-size:12.5px;text-align:center;
    line-height:1.65;padding:28px 16px 48px;
    border-top:1px solid var(--line);
  }
  .page-footer b{color:var(--ink2);font-weight:700}

  /* responsive */
  @media(max-width:1100px){
    .panels{grid-template-columns:1fr}
    .layout{grid-template-columns:1fr; gap:18px; margin-top:18px}
    nav.side{position:static;max-height:none; padding:12px}
    nav.side::before{padding-bottom:8px}
  }
  @media(max-width:620px){
    .wrap{padding:0 14px}
    .subtop-title{width:100%}
    .toolbar .btn2{flex:1; justify-content:center}
  }

  @media print{
    body{background:#fff!important;background-image:none!important;color:#000}
    .toolbar,nav.side{display:none!important}
    .subtop-inner{box-shadow:none;border:1px solid #ccc}
    .subtop-inner::before{display:none}
    .layout{grid-template-columns:1fr;margin:12px 0 0}
    section.report{
      box-shadow:none!important;border:1px solid #bbb!important;
      break-inside:avoid;
    }
    section.report:hover{box-shadow:none!important;border-color:#bbb!important}
    section.report.collapsed .rbody{display:block}
    .rhead{background:#f5f5f5!important;border-bottom:1px solid #ccc}
    .panel{box-shadow:none;border:1px solid #ccc}
    .page-footer{border-top-color:#ddd;color:#555}
  }

  /* ===== 톤 통일 폴리시: 스크롤바·focus·줄무늬·모션감소 (호스트 앱과 일치) ===== */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:var(--radius-pill);border:2px solid var(--bg2);background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  *{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
  a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{
    outline:2px solid rgba(79,70,229,.5); outline-offset:2px; border-radius:8px;
  }
  /* 표 줄무늬(가독성) + 호버 우선 */
  .tbl tbody tr:nth-child(2n) > td{background:#f8fafc}
  .tbl tbody tr:hover > td{background:#eef2ff}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="subtop">
    <div class="subtop-inner">
      <span class="subtop-title">지엠티(GMT) 주간업무보고 통합</span>
      <span class="pill">보고기간 <b>__WEEKLY_META_PERIOD__</b></span>
      <span class="pill">기준일 <b>__WEEKLY_META_BASELINE__</b></span>
    </div>
  </div>

  <div class="layout">
    <nav class="side" id="nav"></nav>
    <main>
      <div class="toolbar">
        <input id="search" type="text" placeholder="🔍 프로젝트·발주처·담당자·키워드 검색 (예: GICOMS, 해상풍력, 페루함, 김태식)" />
        <span class="res" id="searchRes"></span>
        <button class="btn2" onclick="toggleAll(true)">전체 펼치기</button>
        <button class="btn2" onclick="toggleAll(false)">전체 접기</button>
      </div>
      <div id="content"></div>
    </main>

<script>
/* ============ helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const ce=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 사업 구분 → 표준 카테고리 + 배지 클래스 */
function typeCat(t){
  t=(t||'').replace(/\s/g,'');
  if(/유지|운영|상주/.test(t)) return ['유지보수','t-mt'];
  if(/입찰|개찰|조달/.test(t)) return ['입찰','t-bid'];
  if(/제안/.test(t)) return ['제안','t-prop'];
  if(/기획|미정|발굴|예정/.test(t)) return ['기획','t-plan'];
  if(/연구|과제/.test(t)) return ['연구과제','t-rnd'];
  if(/제품|상품|물품|납품|판매/.test(t)) return ['제품/상품','t-prod'];
  if(/이월|완료|종료|하자|유지$/.test(t)) return ['이월/완료','t-etc'];
  if(/수행|구축|개발|용역|사업|솔루션/.test(t)) return ['수행/구축','t-do'];
  if(!t) return ['-','t-etc'];
  return [t,'t-do'];
}
function typeBadge(t){const[lab,cls]=typeCat(t); return `<span class="bdg ${cls}">${esc(t||'-')}</span>`;}
function statusBadge(s){
  if(!s) return '';
  const k=s.toUpperCase();
  let c='prog';
  if(/OPEN/.test(k))c='open'; else if(/NEW/.test(k))c='new';
  else if(/CLOSE|완료|종료/.test(k))c='closed';
  return `<span class="st ${c}">${esc(s)}</span>`;
}

/* 진척률 셀: 숫자면 막대, 아니면 텍스트 */
function progressCell(p){
  if(!p) return '<span class="ctr-td" style="color:var(--faint)">-</span>';
  const plan = (p.plan!=null)?p.plan:null;
  const act  = (p.actual!=null)?p.actual:null;
  if(act==null && plan==null){
    return `<div class="pcell"><div class="txt">${esc(p.text||'-')}</div></div>`;
  }
  const a = act!=null?act:plan, pl = plan!=null?plan:act;
  return `<div class="pcell">
    <div class="pp"><span>계획 ${pl!=null?pl+'%':'-'}</span><span>실적 <b>${act!=null?act+'%':'-'}</b></span></div>
    <div class="tk"><div class="pl" style="width:${Math.min(pl||0,100)}%"></div><div class="ac" style="width:${Math.min(a||0,100)}%"></div></div>
  </div>`;
}

/* 내용 bullet 배열 → ul (객체 {t, sub:[]} 지원) */
function bullets(arr){
  if(!arr||!arr.length) return '<span style="color:var(--faint)">-</span>';
  const li=arr.map(it=>{
    if(typeof it==='string') return `<li>${esc(it)}</li>`;
    let s=`<li>${esc(it.t)}`;
    if(it.sub&&it.sub.length) s+=`<ul>${it.sub.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    return s+'</li>';
  }).join('');
  return `<ul>${li}</ul>`;
}
function matrixHtml(m){
  if(!m) return '';
  const head=`<tr>${m.headers.map((h,i)=>`<th${i===0?' class="l"':''}>${esc(h)}</th>`).join('')}</tr>`;
  const body=m.rows.map(r=>{
    const isTot=/전체|합계|총/.test(r[0]||'');
    return `<tr${isTot?' class="hb"':''}>${r.map((c,i)=>`<td class="${i===0?'l':''}${isTot?' hb':''}">${esc(c)}</td>`).join('')}</tr>`;
  }).join('');
  return `<details class="matrix"><summary>📋 ${esc(m.title||'세부 내역 보기')} (${m.rows.length}행)</summary>
    <div class="scroll"><table class="mtbl">${head}${body}</table></div></details>`;
}

/* ============ build project content cell ============ */
function contentCell(p){
  let h='';
  if(p.content) h+=bullets(p.content);
  if(p.tables) p.tables.forEach(m=>h+=matrixHtml(m));
  if(p.issue){ h+=`<div style="margin-top:6px;font-size:11.5px;color:var(--bad)"><b>⚠ 이슈/향후:</b> ${esc(p.issue)}</div>`; }
  return h||'<span style="color:var(--faint)">-</span>';
}

/* ============ render report ============ */
function pmLine(p){
  const parts=[];
  if(p.po) parts.push(`PO ${p.po}`);
  if(p.pm) parts.push(`PM ${p.pm}`);
  if(p.pl) parts.push(`PL ${p.pl}`);
  if(p.ba) parts.push(`BA ${p.ba}`);
  return parts.join('<br>')||'-';
}

function renderProjects(projects){
  const rows=projects.map(p=>`
    <tr class="prow-data" data-txt="${esc((p.name||'')+' '+(p.po||'')+' '+(p.pm||'')+' '+(p.pl||'')+' '+(p.type||'')+' '+JSON.stringify(p.content||'')+' '+(p.issue||'')).toLowerCase()}">
      <td><div class="pname">${esc(p.name)}${p.subtitle?`<span class="sm">${esc(p.subtitle)}</span>`:''}</div></td>
      <td class="nowrap">${typeBadge(p.type)}</td>
      <td class="ctr-td" style="font-size:11.5px">${esc(p.period||'-')}</td>
      <td class="ctr-td" style="font-size:11.5px">${pmLine(p)}</td>
      <td class="pcell">${progressCell(p.prog)}</td>
      <td>${contentCell(p)}</td>
      <td style="font-size:11.5px;color:var(--muted)">${esc(p.note||'')||'-'}</td>
    </tr>`).join('');
  return `<div class="scroll"><table class="tbl">
    <thead><tr>
      <th style="min-width:190px">프로젝트명</th><th>구분</th><th>기간</th><th>담당(PO/PM/PL)</th>
      <th style="min-width:104px">진척률</th><th style="min-width:300px">업무 내용</th><th>비고</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderIssues(issues){
  const rows=issues.map(i=>`
    <tr class="prow-data" data-txt="${esc((i.title||'')+' '+JSON.stringify(i.content||'')+' '+JSON.stringify(i.plan||'')).toLowerCase()}">
      <td style="min-width:150px"><div class="pname" style="color:var(--bad)">${esc(i.title)}</div></td>
      <td>${bullets(i.content)}</td>
      <td>${bullets(i.plan)}</td>
      <td>${bullets(i.result)}</td>
      <td class="nowrap">${i.status?statusBadge(i.status):(esc(i.note||'')||'-')}</td>
    </tr>`).join('');
  return `<div class="scroll"><table class="tbl">
    <thead><tr><th>제목 / 사업명</th><th>이슈 내용</th><th>조치 계획</th><th>조치 결과</th><th>상태/비고</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderStrategy(rows){
  const r=rows.map(s=>`<tr>
      <td class="nowrap"><b>${esc(s.div||'-')}</b></td>
      <td>${bullets(Array.isArray(s.content)?s.content:[s.content])}</td>
      <td class="ctr-td" style="font-size:11px">${esc(s.start||'-')}<br>→ ${esc(s.plan||'-')}<br>${s.end?'완료 '+esc(s.end):''}</td>
      <td>${bullets(s.action)}</td>
      <td class="nowrap">${statusBadge(s.status)}</td>
    </tr>`).join('');
  return `<div class="scroll"><table class="tbl">
    <thead><tr><th>구분</th><th>내용</th><th>일정(시작→계획/완료)</th><th>조치 계획 및 결과</th><th>상태</th></tr></thead>
    <tbody>${r}</tbody></table></div>`;
}

function renderSales(rows){
  const r=rows.map(s=>`<tr class="prow-data" data-txt="${esc((s.client||'')+' '+(s.project||'')+' '+JSON.stringify(s.content||'')+' '+(s.note||'')).toLowerCase()}">
      <td class="nowrap" style="font-size:11.5px"><b>${esc(s.div||'')}</b></td>
      <td class="nowrap" style="font-size:11.5px">${esc(s.client||'-')}</td>
      <td><div class="pname" style="font-size:12.5px">${esc(s.project||'-')}</div></td>
      <td class="ctr-td nowrap">${esc(s.amount||'-')}</td>
      <td class="ctr-td nowrap" style="font-size:11px">${esc(s.when||'-')}<br><span class="chip">${esc(s.stage||'-')}</span></td>
      <td class="pcell">${s.rate!=null?progressCell({actual:s.rate}):(esc(s.rateText||'-'))}</td>
      <td>${bullets(s.content)}</td>
      <td style="font-size:11px;color:var(--muted)">${esc(s.note||'')||'-'}</td>
    </tr>`).join('');
  return `<div class="scroll"><table class="tbl">
    <thead><tr><th>구분</th><th>발주처</th><th>프로젝트</th><th>금액</th><th>시기/단계</th><th>진행률</th><th>업무 내용</th><th>비고</th></tr></thead>
    <tbody>${r}</tbody></table></div>`;
}

function renderResearch(rows){
  const r=rows.map(s=>`<tr class="prow-data" data-txt="${esc((s.name||'')+' '+(s.lead||'')+' '+(s.org||'')).toLowerCase()}">
      <td><div class="pname" style="font-size:12.5px">${esc(s.name)}</div></td>
      <td class="ctr-td nowrap" style="font-size:11.5px">${esc(s.org||'-')}</td>
      <td class="ctr-td nowrap" style="font-size:11px">${esc(s.period||'-')}</td>
      <td class="ctr-td nowrap">${esc(s.lead||'-')}</td>
      <td class="ctr-td nowrap">${esc(s.fund||'-')}</td>
      <td class="pcell">${s.exec!=null?progressCell({actual:s.exec}):'-'}</td>
      <td>${bullets(s.content)}</td>
    </tr>`).join('');
  return `<div class="scroll"><table class="tbl">
    <thead><tr><th>과제명</th><th>전문/주관기관</th><th>기간</th><th>연구책임자</th><th>정부출연금(천원)</th><th>집행률</th><th>진행사항</th></tr></thead>
    <tbody>${r}</tbody></table></div>`;
}

function block(cls,title,count,bodyHtml){
  const c = count!=null?`<span class="c">${count}건</span>`:'';
  return `<div class="block ${cls}"><div class="bh"><span class="bar"></span>${title}${c}</div>${bodyHtml}</div>`;
}

function renderReport(r,idx){
  const sec=ce('section','report'+(idx>0?' collapsed':''));
  sec.id=r.id;
  // status summary chips on header (project type counts)
  const allItems=(r.projects||[]).length+(r.sales||[]).length+(r.research||[]).length;
  const issN=(r.issues||[]).length;
  let chips='';
  if(issN) chips+=`<span class="st open">이슈 ${issN}</span>`;
  chips+=`<span class="chip">보고 ${allItems}건</span>`;
  let body='';
  if(r.strategy&&r.strategy.length) body+=block('strat','전략회의',r.strategy.length,renderStrategy(r.strategy));
  if(r.issues&&r.issues.length) body+=block('iss','이슈 보고',r.issues.length,renderIssues(r.issues));
  if(r.projects&&r.projects.length) body+=block('proj','업무 보고',r.projects.length,renderProjects(r.projects));
  if(r.sales&&r.sales.length) body+=block('sales','영업 / 기획',r.sales.length,renderSales(r.sales));
  if(r.research&&r.research.length) body+=block('proj','연구과제',r.research.length,renderResearch(r.research));
  if(r.nextWeek&&r.nextWeek.length) body+=block('next','차주 주요 업무 계획',null,`<div class="tbl" style="padding:11px 13px">${bullets(r.nextWeek)}</div>`);
  if(!body) body='<div class="empty">표준 양식만 제출(세부 보고 내용 없음)</div>';

  sec.innerHTML=`
    <div class="rhead" onclick="this.parentElement.classList.toggle('collapsed')">
      <div class="ic">${esc(r.icon||r.org.slice(0,2))}</div>
      <div class="tt">
        <h2>${esc(r.org)}</h2>
        <div class="meta">보고자 <b>${esc(r.reporter)}</b> · 수신 <b>${esc(r.recipient||'-')}</b></div>
      </div>
      <div class="rstat">${chips}</div>
      <div class="chev">▼</div>
    </div>
    <div class="rbody">${body}</div>`;
  return sec;
}

/* ============ nav ============ */
function buildNav(){
  const groups={};
  REPORTS.forEach((r,i)=>{(groups[r.group]=groups[r.group]||[]).push({r,i});});
  let html='';
  Object.entries(groups).forEach(([g,items])=>{
    html+=`<div class="ngroup">${esc(g)}</div>`;
    items.forEach(({r,i})=>{
      const n=(r.projects||[]).length+(r.sales||[]).length+(r.research||[]).length;
      html+=`<a class="nav" data-target="${r.id}" onclick="goto('${r.id}')">${esc(r.org)}<span class="cnt">${n}</span></a>`;
    });
  });
  $('#nav').innerHTML=html;
}
function goto(id){
  const sec=document.getElementById(id);
  if(sec){sec.classList.remove('collapsed'); sec.scrollIntoView({behavior:'smooth',block:'start'});}
}
function toggleAll(open){document.querySelectorAll('section.report').forEach(s=>s.classList.toggle('collapsed',!open));}

/* ============ search ============ */
function doSearch(q){
  q=q.trim().toLowerCase();
  const rows=document.querySelectorAll('.prow-data');
  let shown=0;
  const secHit={};
  rows.forEach(tr=>{
    const hit = !q || (tr.dataset.txt||'').includes(q);
    tr.style.display = hit?'':'none';
    if(hit){shown++; const sec=tr.closest('section.report'); if(sec)secHit[sec.id]=true;}
  });
  document.querySelectorAll('section.report').forEach(sec=>{
    if(!q){sec.style.display='';}
    else{
      const hit=secHit[sec.id];
      sec.style.display=hit?'':'none';
      if(hit)sec.classList.remove('collapsed');
    }
  });
  $('#searchRes').textContent = q?`${shown}건 일치`:'';
}

/* ============ scroll spy ============ */
function spy(){
  const links=document.querySelectorAll('nav.side a.nav');
  const secs=[...document.querySelectorAll('section.report')];
  let cur=secs[0]?.id;
  const y=window.scrollY+120;
  for(const s of secs){ if(s.offsetTop<=y) cur=s.id; }
  links.forEach(a=>a.classList.toggle('active',a.dataset.target===cur));
}

/* ============ init ============ */
function init(){
  if(typeof REPORTS==='undefined'){ $('#content').innerHTML='<div class="empty">데이터(reports-data.js)를 불러오지 못했습니다.</div>'; return; }
  buildNav();
  const c=$('#content'); REPORTS.forEach((r,i)=>c.appendChild(renderReport(r,i)));
  $('#search').addEventListener('input',e=>doSearch(e.target.value));
  window.addEventListener('scroll',spy,{passive:true}); spy();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
